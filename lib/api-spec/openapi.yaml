openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: system
    description: Service metadata
  - name: sessions
    description: Online session tracking
paths:
  /:
    get:
      operationId: getApiInfo
      tags: [system]
      summary: Get API information
      description: Returns basic service metadata.
      responses:
        "200":
          description: Service metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiInfo"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /sessions/join:
    post:
      operationId: joinSession
      tags: [sessions]
      summary: Register an online session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinSessionBody"
      responses:
        "200":
          description: Session registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sessions/leave:
    post:
      operationId: leaveSession
      tags: [sessions]
      summary: Remove an online session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveSessionBody"
      responses:
        "200":
          description: Session removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    ApiInfo:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        status:
          type: string
      required:
        - name
        - version
        - status
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    JoinSessionBody:
      type: object
      properties:
        sessionId:
          type: string
    LeaveSessionBody:
      type: object
      properties:
        sessionId:
          type: string
      required:
        - sessionId
    SessionStatus:
      type: object
      properties:
        sessionId:
          type: string
        onlineCount:
          type: integer
          minimum: 0
      required:
        - sessionId
        - onlineCount
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

